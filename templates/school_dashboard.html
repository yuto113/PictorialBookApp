<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蟄ｦ譬｡繝繝・す繝･繝懊・繝・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0fff4 0%, #f0f9ff 100%);
            color: #333;
        }

        .brand-color {
            color: #28a745;
        }

        .footer {
            color: #666;
            padding: 1rem 0;
        }

        .card {
            border-radius: 1rem;
        }
    </style>
</head>

<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">{{ school.name }}</small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/user">繝帙・繝縺ｸ</a>
        </div>
    </nav>

    <div class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <h2 class="mb-4 brand-color">{{ school.name }} 繝繝・す繝･繝懊・繝・/h2>
        <div class="d-flex gap-3 align-items-center mb-3">
            <p class="text-muted mb-0">蟄ｦ譬｡繧ｳ繝ｼ繝・ <code class="fw-bold">{{ school.code }}</code></p>
            {% if user.role == 'school_admin' %}
            <form method="POST" action="/school/toggle_map" class="d-inline">
                <button type="submit" class="btn btn-sm {{ 'btn-success' if school.use_map == 1 else 'btn-outline-secondary' }}">
                    亮・・蝨ｰ蝗ｳ讖溯・: {{ 'ON' if school.use_map == 1 else 'OFF' }}
                </button>
            </form>
            {% endif %}
        </div>

        <div class="row g-4">

            <!-- 繧ｯ繝ｩ繧ｹ荳隕ｧ繝ｻ菴懈・ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 h-100">
                    <h5 class="fw-bold mb-3">答 繧ｯ繝ｩ繧ｹ荳隕ｧ</h5>
                    {% for cls in classes %}
                    <div class="border rounded p-2 mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>{{ cls.name }}</strong>
                                <span class="text-muted small ms-2">繧ｳ繝ｼ繝・ <code>{{ cls.code }}</code></span>
                                <span class="badge bg-info text-dark ms-2">{{ cls.members|length }}莠ｺ</span>
                            </div>
                        </div>
                        <!-- 諡・ｻｻ險ｭ螳夲ｼ・chool_admin縺ｮ縺ｿ・・-->
                        {% if user.role == 'school_admin' %}
                        <div class="mt-2">
                            <small class="text-muted">諡・ｻｻ:
                                {% if class_teachers[cls.id] %}
                                <strong>{{ class_teachers[cls.id].name }}</strong>
                                {% else %}
                                譛ｪ險ｭ螳・
                                {% endif %}
                            </small>
                            <form method="POST" action="/school/set_teacher" class="d-flex gap-2 mt-1">
                                <input type="hidden" name="class_id" value="{{ cls.id }}">
                                <select name="teacher_id" class="form-select form-select-sm" style="width:150px;">
                                    <option value="">諡・ｻｻ繧帝∈謚・/option>
                                    {% for teacher in teachers %}
                                    <option value="{{ teacher.id }}" {% if class_teachers[cls.id] and
                                        class_teachers[cls.id].id==teacher.id %}selected{% endif %}>{{ teacher.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                                <button type="submit" class="btn btn-sm btn-success">險ｭ螳・/button>
                            </form>
                        </div>
                        {% endif %}
                    </div>
                    {% else %}
                    <p class="text-muted small">縺ｾ縺繧ｯ繝ｩ繧ｹ縺後≠繧翫∪縺帙ｓ縲・/p>
                    {% endfor %}

                    <hr>
                    <h6 class="fw-bold">譁ｰ縺励＞繧ｯ繝ｩ繧ｹ繧剃ｽ懈・</h6>
                    <form method="POST" action="/school/create_class" class="d-flex gap-2">
                        <input type="text" name="class_name" class="form-control form-control-sm"
                            placeholder="繧ｯ繝ｩ繧ｹ蜷搾ｼ井ｾ具ｼ・蟷ｴA邨・ｼ・ required>
                        <button type="submit" class="btn btn-sm btn-success">菴懈・</button>
                    </form>
                </div>
            </div>

            <!-- 逕溷ｾ剃ｸ隕ｧ繝ｻ逋ｻ骭ｲ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4 h-100">
                    <h5 class="fw-bold mb-3">捉窶昨沁・逕溷ｾ剃ｸ隕ｧ</h5>
                    <div style="max-height:200px; overflow-y:auto;">
                        {% for student in students %}
                        <div class="border rounded p-2 mb-2">
                            <strong>{{ student.name }}</strong>
                            <span class="text-muted small ms-2">ID: {{ student.id }}</span>
                            <div class="text-muted small">
                                謇螻槭け繝ｩ繧ｹ:
                                {% for cm in student.dates %}{% endfor %}
                                {% set class_count = namespace(count=0) %}
                                {% for cls in classes %}
                                {% for cm in cls.members %}
                                {% if cm.user_id == student.id %}
                                <span class="badge bg-success">{{ cls.name }}</span>
                                {% set class_count.count = class_count.count + 1 %}
                                {% endif %}
                                {% endfor %}
                                {% endfor %}
                            </div>
                        </div>
                        {% else %}
                        <p class="text-muted small">縺ｾ縺逕溷ｾ偵′縺・∪縺帙ｓ縲・/p>
                        {% endfor %}
                    </div>

                    <hr>
                    <h6 class="fw-bold">逕溷ｾ偵ｒ譁ｰ隕冗匳骭ｲ</h6>
                    <form method="POST" action="/school/create_student">
                        <div class="d-flex gap-2 mb-2">
                            <input type="text" name="name" class="form-control form-control-sm" placeholder="蜷榊燕"
                                required>
                            <input type="text" name="password" class="form-control form-control-sm"
                                placeholder="蛻晄悄繝代せ繝ｯ繝ｼ繝・ required>
                        </div>
                        <button type="submit" class="btn btn-sm btn-success w-100">逋ｻ骭ｲ</button>
                    </form>
                </div>
            </div>

            <!-- 繧ｯ繝ｩ繧ｹ縺ｫ逕溷ｾ偵ｒ逋ｻ骭ｲ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">搭 逕溷ｾ偵ｒ繧ｯ繝ｩ繧ｹ縺ｫ逋ｻ骭ｲ</h5>
                    <form method="POST" action="/school/register_student">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">逕溷ｾ偵ｒ驕ｸ謚・/label>
                            <select name="student_id" class="form-select form-select-sm" required>
                                <option value="">驕ｸ謚槭＠縺ｦ縺上□縺輔＞</option>
                                {% for student in students %}
                                <option value="{{ student.id }}">{{ student.name }}・・D: {{ student.id }}・・/option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">繧ｯ繝ｩ繧ｹ繧帝∈謚・/label>
                            <select name="class_id" class="form-select form-select-sm" required>
                                <option value="">驕ｸ謚槭＠縺ｦ縺上□縺輔＞</option>
                                {% for cls in classes %}
                                <option value="{{ cls.id }}">{{ cls.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-sm btn-success w-100">逋ｻ骭ｲ</button>
                    </form>
                </div>
            </div>

            <!-- 謨吝ｸｫ荳隕ｧ繝ｻ逋ｻ骭ｲ・・chool_admin縺ｮ縺ｿ・・-->
            {% if user.role == 'school_admin' %}
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">捉窶昨沛ｫ 謨吝ｸｫ荳隕ｧ</h5>
                    {% for teacher in teachers %}
                    <div class="border rounded p-2 mb-2">
                        <strong>{{ teacher.name }}</strong>
                        <span class="badge bg-primary ms-2">{{ teacher.role }}</span>
                    </div>
                    {% endfor %}

                    <hr>
                    <h6 class="fw-bold">謨吝ｸｫ繧呈眠隕冗匳骭ｲ</h6>
                    <form method="POST" action="/school/create_teacher">
                        <div class="d-flex gap-2 mb-2">
                            <input type="text" name="name" class="form-control form-control-sm" placeholder="蜷榊燕"
                                required>
                            <input type="text" name="password" class="form-control form-control-sm"
                                placeholder="蛻晄悄繝代せ繝ｯ繝ｼ繝・ required>
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary w-100">逋ｻ骭ｲ</button>
                    </form>
                </div>
            </div>
            {% endif %}

        </div>
    </div>

    <footer class="footer text-center mt-4">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
