<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>繝輔Ξ繝ｳ繝峨Μ繧ｹ繝・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            background: {{ 'linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%)' if is_school_user else 'linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%)' }};
            color: #333;
        }

        .brand-color {
            color: {{ '#28a745' if is_school_user else '#ff6b6b' }};
        }
        {% if is_school_user %}
        .btn-primary, .btn-danger {
            background-color: #28a745 !important;
            border-color: #28a745 !important;
        }
        .btn-outline-primary, .btn-outline-danger {
            color: #28a745 !important;
            border-color: #28a745 !important;
        }
        .btn-outline-primary:hover, .btn-outline-danger:hover {
            background-color: #28a745 !important;
            color: white !important;
        }
        {% endif %}
    </style>
</head>

<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/user">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・/small>
            </a>
            <div>
                <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・/a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4 brand-color">繝輔Ξ繝ｳ繝峨Μ繧ｹ繝・/h2>

        {% if pending_requests %}
        <h3 class="mt-5 mb-3">繝輔Ξ繝ｳ繝臥筏隲・/h3>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for request in pending_requests %}
            <div class="col" id="request_{{ request.id }}">
                <div class="card card-tilt shadow-sm border-0" style="border-radius: 1rem;">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ request.name }}</h5>
                        <p class="text-muted small">繝輔Ξ繝ｳ繝臥筏隲九′譚･縺ｦ縺・∪縺・/p>
                        <div class="d-flex justify-content-center gap-2 mt-3">
                            <button class="btn btn-success btn-sm" onclick="acceptFriend({{ request.id }})">謇ｿ隱・/button>
                            <button class="btn btn-danger btn-sm" onclick="rejectFriend({{ request.id }})">諡貞凄</button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <h3 class="mt-5 mb-3">繝輔Ξ繝ｳ繝・/h3>
        {% if friends %}
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for friend in friends %}
            <div class="col" id="friend_{{ friend.id }}">
                <div class="card card-tilt shadow-sm border-0" style="border-radius: 1rem;">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ friend.name }}</h5>
                        <div class="d-flex justify-content-center gap-2 mt-3">
                            <a href="/profile/{{ friend.id }}" class="btn btn-outline-primary btn-sm">繧｢繝・・縺励◆繝・・繧ｿ繧堤｢ｺ隱・/a>
                            <button class="btn btn-outline-danger btn-sm"
                                onclick="removeFriend({{ friend.id }})">繝輔Ξ繝ｳ繝画ｶ亥悉</button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="text-center">
            <p class="text-muted">繝輔Ξ繝ｳ繝峨′縺・∪縺帙ｓ縲・/p>
            <a href="/friend_search" class="btn btn-primary">繝輔Ξ繝ｳ繝峨ｒ謗｢縺・/a>
        </div>
        {% endif %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ 2026 蝗ｳ髑・窶・ver.1.0</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>

    <script>
        async function acceptFriend(requesterId) {
            const res = await fetch(`/api/friend/accept/${requesterId}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                document.getElementById(`request_${requesterId}`).remove();
                location.reload(); // 繝輔Ξ繝ｳ繝峨Μ繧ｹ繝医ｒ譖ｴ譁ｰ
            }
        }

        async function rejectFriend(requesterId) {
            const res = await fetch(`/api/friend/reject/${requesterId}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                document.getElementById(`request_${requesterId}`).remove();
            }
        }

        async function removeFriend(friendId) {
            if (!confirm('繝輔Ξ繝ｳ繝峨ｒ蜑企勁縺励∪縺吶°・・)) return;
            const res = await fetch(`/api/friend/remove/${friendId}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                document.getElementById(`friend_${friendId}`).remove();
            }
        }
    </script>

<script>
    // メンテナンスモード監視（0.3秒ごと）
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) {
                    window.location.href = '/maintenance/current';
                }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
</script>

</body>

</html>
