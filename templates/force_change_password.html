<!DOCTYPE html>
<html lang="ja">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

            background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%);
            color: #333;
            min-height: 100vh;
        }

        .brand-color {
            color: #ff6b6b;

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4" style="border-radius:1.5rem;">

                    </div>

                    {% if message %}
                    <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">譁ｰ縺励＞繝代せ繝ｯ繝ｼ繝・/label>
                            <input type="password" name="new_password" class="form-control" required minlength="1"

                        </div>
                        <div class="mb-3">

                                maxlength="10">
                        </div>
                        <button type="submit" class="btn btn-danger w-100">繝代せ繝ｯ繝ｼ繝峨ｒ螟画峩縺吶ｋ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
