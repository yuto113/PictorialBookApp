<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>メンテナンス中 - 図鑑</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .maintenance-card {
            background: white;
            border-radius: 2rem;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
        }
        .maintenance-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: spin 4s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .brand-color { color: #ff6b6b; }
        .progress { height: 6px; border-radius: 3px; }
        .countdown { font-size: 1.2rem; font-weight: bold; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="maintenance-icon">🔧</div>
        <h1 class="brand-color fw-bold mb-3">メンテナンス中</h1>
        <p class="text-muted fs-5 mb-2">ただいまシステムのメンテナンスを行っています。</p>
        <p class="text-muted mb-3">しばらくお待ちください。</p>

        <div class="alert alert-info mb-3">
            <small>⏰ <span id="countdown_msg">30秒後に自動で再確認します</span></small>
        </div>

        <div class="progress mb-3">
            <div class="progress-bar bg-danger" id="progress_bar"
                role="progressbar" style="width: 100%"></div>
        </div>

        <p class="countdown" id="countdown">30</p>

        <button onclick="checkNow()" class="btn btn-danger mt-2">
            🔄 今すぐ確認する
        </button>

        {% if session.get('user_id') == 2 %}
        <hr class="mt-4">
        <p class="text-muted small">管理者メニュー</p>
        <form method="POST" action="/admin/maintenance/off">
            <button type="submit" class="btn btn-success">
                ✅ メンテナンスモードを解除する
            </button>
        </form>
        {% endif %}
    </div>

    <script>
        const TOTAL = 30;
        let remaining = TOTAL;
        let returnUrl = document.referrer || '/';

        function checkNow() {
            // サイトが復旧しているか確認
            fetch('/api/health')
                .then(res => {
                    if (res.ok) {
                        // 復旧していたら元のページへ
                        window.location.href = returnUrl;
                    } else {
                        // まだメンテナンス中
                        remaining = TOTAL;
                    }
                })
                .catch(() => {
                    remaining = TOTAL;
                });
        }

        function tick() {
            remaining--;
            document.getElementById('countdown').textContent = remaining;
            const pct = (remaining / TOTAL) * 100;
            document.getElementById('progress_bar').style.width = pct + '%';

            if (remaining <= 0) {
                document.getElementById('countdown_msg').textContent = '確認中...';
                checkNow();
                remaining = TOTAL;
            }
        }

        setInterval(tick, 1000);
    </script>
</body>
</html>
