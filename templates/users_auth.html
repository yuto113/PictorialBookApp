<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー一覧 - パスワード認証</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <div class="container py-4">
        <a href="/user" class="btn btn-sm btn-outline-secondary mb-3">← 戻る</a>
        <div class="card p-3 mb-3">
            <h4 class="card-title">ユーザー一覧にアクセスするには管理者パスワードが必要です</h4>
            {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endif %}
            <form method="post">
                <div class="mb-3">
                    <label for="password" class="form-label">管理者パスワード</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">認証して表示</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) { window.location.href = '/maintenance/current'; }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
    </script>
</body>
</html>
