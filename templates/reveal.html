<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>繧｢繧ｫ繧ｦ繝ｳ繝郁ｨｭ螳夂｢ｺ隱・title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body { background: {{ 'linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%)' if is_school_user else 'linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%)' }}; color:#333; }
        .brand-color { color: {{ '#28a745' if is_school_user else '#ff6b6b' }}; }
        .card-upload { border-radius: 1rem; box-shadow: 0 10px 30px rgba(16,24,40,0.06); }
        .footer { color: #666; padding: 1rem 0; }
        .form-control:focus { box-shadow: 0 0 0 0.2rem rgba(255,107,107,0.12); }
    </style>
</head>

<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 brand-color">蝗ｳ髑・span>
                <small class="text-muted ms-2">繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・small>
            </a>
            <div>
                <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-upload p-4 bg-white">
                    <h3 class="mb-3">繧｢繧ｫ繧ｦ繝ｳ繝育｢ｺ隱搾ｿｽE邱ｨ髮・/h3>
                    <p class="text-muted small">遒ｺ隱阪☆繧九↓縺ｯ迴ｾ蝨ｨ縺ｮ繝代せ繝ｯ繝ｼ繝峨ｒ蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・p>

                    {% if message %}
                    <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}

                    {% if revealed %}
                    <div class="alert alert-success">
                        <p><strong>id:</strong> {{ revealed.id }}</p>
                        <p><strong>name:</strong> {{ revealed.name }}</p>
                        <p><strong>password:</strong> {{ revealed.password }}</p>
                    </div>

                    <h5 class="mt-3">諠・ｱ・ｽ・ｽ縺ｮ邱ｨ髮・/h5>
                    <form method="post">
                        <input type="hidden" name="update" value="1">
                        <div class="mb-3">
                            <label for="current_password" class="form-label">迴ｾ蝨ｨ縺ｮ繝代せ繝ｯ繝ｼ繝会ｼ育｢ｺ隱咲畑・ｽE・ｽE/label>
                            <input type="password" class="form-control" id="current_password" name="current_password" required minlength="1" maxlength="10">
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">蜷榊燕</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ revealed.name }}">
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label">譁ｰ縺励＞繝代せ繝ｯ繝ｼ繝会ｼ育ｩｺ縺ｮ縺ｾ縺ｾ縺ｪ繧牙､画峩縺励∪縺帙ｓ・ｽE・ｽE/label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="1" maxlength="10">
                        </div>
                        <div class="mb-3">
                            <label for="new_password2" class="form-label">譁ｰ縺励＞繝代せ繝ｯ繝ｼ繝会ｼ育｢ｺ隱搾ｼ・label>
                            <input type="password" class="form-control" id="new_password2" name="new_password2" required minlength="1" maxlength="10">
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <button type="submit" class="btn btn-primary">譖ｴ譁ｰ</button>
                            <a href="/user" class="btn btn-link">繝幢ｿｽE繝逕ｻ髱｢縺ｸ</a>
                        </div>
                    </form>
                    {% else %}
                    <form method="post">
                        <div class="mb-3">
                            <label for="password" class="form-label">迴ｾ蝨ｨ縺ｮ繝代せ繝ｯ繝ｼ繝・label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <button type="submit" class="btn btn-primary">遒ｺ隱・button>
                            <a href="/user" class="btn btn-link">繝幢ｿｽE繝逕ｻ髱｢縺ｸ</a>
                        </div>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑鯛・{{ verj }}</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <script src="/static/js/index.js"></script>

<script>
    // 繝｡繝ｳ繝・リ繝ｳ繧ｹ繝｢繝ｼ繝臥屮隕厄ｼ・.3遘偵＃縺ｨ・・
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) {
                    window.location.href = '/maintenance/current';
                }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
</script>

</body>

</html>
