<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者ログイン - 図鑑</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%); color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 2rem; padding: 3rem; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
        .brand-color { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size:3rem;">🔧</div>
        <h2 class="brand-color fw-bold mb-1">メンテナンス中</h2>
        <p class="text-muted mb-4">管理者としてログインしてください</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">ID</label>
                <input type="number" name="id" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">ログイン</button>
        </form>
        <div class="mt-3">
            <a href="/maintenance/current" class="text-muted small">← メンテナンス画面に戻る</a>
        </div>
    </div>
</body>
</html>
