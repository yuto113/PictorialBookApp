<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 蝨ｰ蝗ｳ蟄ｦ鄙偵し繝ｳ繝励Ν・ｽE・ｽ蝗ｽ蝨溷慍逅・・ｽ・ｽ繧ｿ繧､繝ｫ・ｽE・ｽE/title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* 2. 蝨ｰ蝗ｳ繧定｡ｨ遉ｺ縺吶ｋ遽・峇・ｽ・ｽ縺ｮ繧ｵ繧､繧ｺ繧呈欠螳壹☆繧具ｼ亥ｿ・ｦ・ｿｽ・ｽ・・/
        #map {
            width: 100%;
            height: 600px;
        }
        body {
            font-family: sans-serif;
            margin: 20px;
        }
    </style>
</head>
<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">

    <h2>Leaflet ﾃ・蝗ｽ蝨溷慍逅・・ｽ・ｽ繧ｿ繧､繝ｫ</h2>
    <p>蝨ｰ蝗ｳ繧偵け繝ｪ繝・ヨ・ｽ・ｽ縺励◆蝣ｴ謇縺ｫ繝斐Φ繧堤ｧｻ蜍輔＆縺帙◆繧翫∝聖縺榊・縺励ｒ陦ｨ遉ｺ縺励◆繧翫〒縺阪∪縺吶・p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 蝨ｰ蝗ｳ縺ｮ蛻晄悄險ｭ螳・---
        
        // 蝨ｰ蝗ｳ縺ｮ荳ｭ蠢・ｦ・ｿｽ・ｽ邱ｯ蠎ｦ, 邨悟ｺｦ・ｽE・ｽ縺ｨ繧ｺ繝ｼ繝繝ｬ繝吶Ν繧定ｨｭ螳・
        const map = L.map('map').setView([35.125695, 136.918672], 15);

        // --- 繧ｿ繧､繝ｫ繝ｬ繧､繝､繝ｼ・ｽE・ｽ蝗ｽ蝨溷慍逅・・ｽ・ｽ・ｽE・ｽ・ｽE霑ｽ蜉 ---
        
        // 闡嶺ｽ懈ｨｩ陦ｨ險假ｼ》tribution・ｽE・ｽ縺ｫ蝗ｽ蝨溷慍逅・・ｽ・ｽ縺ｮ繝ｫ繝ｼ繝ｫ繧帝←逕ｨ
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>蝨ｰ逅・・ｽ・ｽ繧ｿ繧､繝ｫ</a>"
        }).addTo(map);

        // --- 繝橸ｿｽE繧ｫ繝ｼ・ｽE・ｽ繝斐Φ・ｽE・ｽ・ｽE霑ｽ蜉 ---

        // 繝橸ｿｽE繧ｫ繝ｼ繧剃ｽ懈・縺励※蝨ｰ蝗ｳ縺ｫ霑ｽ蜉・ｽE・ｽ萓・ dot.labo・ｽE・ｽE
        const marker = L.marker([35.125695, 136.918672]).addTo(map);
        marker.bindPopup("<b>縺薙％縺ｯdot.labo逾槫ｮｮ蜑肴｡縺ｧ縺・b><br>10:00~ 繝励Ο繧ｰ繝ｩ繝溘Φ繧ｰ鬆大ｼｵ繧阪≧・ｽE・ｽE).openPopup();

        // 繧ゅ≧荳縺､縺ｮ蝗ｺ螳夲ｿｽE繝ｼ繧ｫ繝ｼ・ｽE・ｽ萓・ 閾ｪ螳・・ｽ・ｽE
        const marker2 = L.marker([35.128277, 136.903349]).addTo(map);
        marker2.bindPopup("<b>縺薙％縺ｯ螳ｶ縺ｧ縺・b><br>譌ｩ縺丞ｸｰ繧阪≧・ｽE・ｽE);

        // --- 荳ｻ隕∝慍轤ｹ縺ｮ蝗ｺ螳壹ヴ繝ｳ・ｽE・ｽ・ｽE驕灘ｺ懃恁縺斐→縺ｫ隍・・ｽ・ｽ・ｽE・ｽE---
        const prefectures = {
            "譚ｱ莠ｬ驛ｽ": [
                { name: "譚ｱ莠ｬ鬧・, coords: [35.681236, 139.767125] },
                { name: "貂玖ｰｷ繧ｹ繧ｯ繝ｩ繝ｳ繝悶Ν莠､蟾ｮ轤ｹ", coords: [35.659494, 139.700553] },
                { name: "譁ｰ螳ｿ鬧・・ｽ・ｽ隘ｿ蜿｣・ｽE・ｽE, coords: [35.690921, 139.700258] },
                { name: "豬・・ｽ・ｽ蟇ｺ", coords: [35.714765, 139.796655] },
                { name: "譚ｱ莠ｬ繧ｿ繝ｯ繝ｼ", coords: [35.6585805, 139.7454329] },
                { name: "譚ｱ莠ｬ繧ｹ繧ｫ繧､繝・ヨ・ｽ・ｽ繝ｼ", coords: [35.7100627, 139.8107004] },
                { name: "荳企㍽蜈ｬ蝨・, coords: [35.713768, 139.774473] },
                { name: "譏取ｲｻ逾槫ｮｮ", coords: [35.676397, 139.699325] },
                { name: "驫蠎ｧ", coords: [35.671667, 139.764444] },
                { name: "蜈ｭ譛ｬ譛ｨ繝偵Ν繧ｺ", coords: [35.660507, 139.729135] }
            ],
            "諢帷衍逵・: [
                { name: "蜷榊商螻矩ｧ・, coords: [35.170915, 136.881537] },
                { name: "蜷榊商螻句沁", coords: [35.185167, 136.89957] },
                { name: "螟ｧ鬆郁ｦｳ髻ｳ・ｽE・ｽ螟ｧ鬆亥膚蠎苓｡暦ｼ・ coords: [35.154722, 136.906389] },
                { name: "譬・・ｽ・ｽ荵・・ｽ・ｽ螟ｧ騾夲ｼ・ coords: [35.170282, 136.905569] },
                { name: "辭ｱ逕ｰ逾槫ｮｮ", coords: [35.14311, 136.906611] },
                { name: "繝ｬ繧ｴ繝ｩ繝ｳ繝会ｿｽE繧ｸ繝｣繝代Φ", coords: [35.1175, 136.8997] },
                { name: "雎顔伐繧ｹ繧ｿ繧ｸ繧｢繝・ｽE・ｽ雎顔伐蟶ゑｼ・ coords: [35.084722, 137.156389] },
                { name: "繝医Κ繧ｿ逕｣讌ｭ謚陦楢ｨ伜ｿｵ鬢ｨ", coords: [35.162223, 136.883643] },
                { name: "蟯｡蟠主沁", coords: [34.948056, 137.163611] },
                { name: "譚ｱ螻ｱ蜍墓､咲黄蝨・, coords: [35.148056, 136.985278] }
            ],
            "螟ｧ髦ｪ蠎・: [
                { name: "螟ｧ髦ｪ鬧・・ｽ・ｽ譴・・ｽ・ｽ・ｽE・ｽE, coords: [34.702485, 135.495951] },
                { name: "螟ｧ髦ｪ蝓・, coords: [34.687315, 135.526201] },
                { name: "驕馴灘・ｽE・ｽ・ｽE讖具ｼ・ coords: [34.668702, 135.501777] },
                { name: "縺ｪ繧難ｿｽE・ｽE・ｽ繝溘リ繝滂ｿｽE・ｽE, coords: [34.664567, 135.501256] },
                { name: "譴・・ｽ・ｽ繧ｹ繧ｫ繧､繝薙Ν・ｽE・ｽ遨ｺ荳ｭ蠎ｭ蝨抵ｼ・ coords: [34.705332, 135.489538] },
                { name: "螟ｩ邇句ｯｺ・ｽE・ｽ騾壼､ｩ髢｣・ｽE・ｽE, coords: [34.654931, 135.513175] },
                { name: "豬ｷ驕企､ｨ・ｽE・ｽ螟ｧ髦ｪ豌ｴ譌城､ｨ・ｽE・ｽE, coords: [34.654095, 135.428333] },
                { name: "繝ｦ繝九ヰ繝ｼ繧ｵ繝ｫ繝ｻ繧ｹ繧ｿ繧ｸ繧ｪ繝ｻ繧ｸ繝｣繝代Φ", coords: [34.669419, 135.432446] },
                { name: "菴丞翠螟ｧ遉ｾ", coords: [34.607506, 135.498652] },
                { name: "蝗帛､ｩ邇句ｯｺ", coords: [34.651389, 135.513333] }
            ]
        };

        Object.keys(prefectures).forEach(function(pref) {
            prefectures[pref].forEach(function(p) {
                L.marker(p.coords).addTo(map).bindPopup("<b>" + p.name + "</b><br>" + pref);
            });
        });

        // --- 繧ｯ繝ｪ繝・ヨ・ｽ・ｽ縺ｧ遘ｻ蜍輔☆繧九ヴ繝ｳ縺ｮ蛻晄悄蛹厄ｼ亥ｭ伜惠縺励↑縺九▲縺・arker3 繧貞ｮ夂ｾｩ・ｽE・ｽE---
        const marker3 = L.marker(map.getCenter()).addTo(map);

        // 繧ｯ繝ｪ繝・ヨ・ｽ・ｽ縺励◆蝣ｴ謇縺ｫ繝斐Φ繧堤ｧｻ蜍輔＆縺帙ｋ讖滂ｿｽE
        map.on('click', function(e) {
            // 繧ｯ繝ｪ繝・ヨ・ｽ・ｽ縺励◆蝨ｰ轤ｹ縺ｮ邱ｯ蠎ｦ繝ｻ邨悟ｺｦ繧貞叙蠕・■
            const latlng = e.latlng;
            // 繝橸ｿｽE繧ｫ繝ｼ縺ｮ菴咲ｽｮ繧呈峩譁ｰ
            marker3.setLatLng(latlng);
            // 繝昴ャ繝励い繝・ヨ・ｽE縺ｮ蜀・・ｽ・ｽ繧よ嶌縺肴鋤縺医※陦ｨ遉ｺ
            marker3.setPopupContent("蠎ｧ讓・ " + latlng.toString()).openPopup();
        });
    </script>

</body>
</html>
