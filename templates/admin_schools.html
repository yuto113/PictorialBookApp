<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蟄ｦ譬｡邂｡逅・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%);
            color: #333;
        }

        .brand-color {
            color: #ff6b6b;
        }

        .footer {
            color: #666;
            padding: 1rem 0;
        }
    </style>
</head>

<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/user">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・/small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・/a>
        </div>
    </nav>

    <div class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <h2 class="mb-4 brand-color">蟄ｦ譬｡繧ｰ繝ｫ繝ｼ繝礼ｮ｡逅・/h2>

        <div class="card p-4 mb-4 shadow-sm border-0" style="border-radius:1rem;">
            <h5 class="fw-bold mb-3">譁ｰ縺励＞蟄ｦ譬｡繧剃ｽ懈・</h5>
            <form method="POST" class="d-flex gap-2">
                <input type="text" name="school_name" class="form-control" placeholder="蟄ｦ譬｡蜷阪ｒ蜈･蜉・ required>
                <button type="submit" class="btn btn-danger">菴懈・</button>
            </form>
        </div>

        <h4 class="mb-3">蟄ｦ譬｡荳隕ｧ</h4>
        {% for school in schools %}
        <div class="card mb-3 shadow-sm border-0" style="border-radius:1rem;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">{{ school.name }}</h5>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-muted small">蟄ｦ譬｡繧ｳ繝ｼ繝会ｼ・/span>
                            <code class="fs-5 fw-bold text-danger" id="code_{{ school.id }}">{{ school.code }}</code>
                            <button class="btn btn-sm btn-outline-secondary"
                                onclick="copyCode('{{ school.code }}')">繧ｳ繝斐・</button>
                        </div>
                        <small class="text-muted">繝｡繝ｳ繝舌・謨ｰ: {{ school.members|length }}莠ｺ</small>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/admin/schools/{{ school.id }}" class="btn btn-sm btn-outline-primary">隧ｳ邏ｰ</a>
                        <form method="POST" action="/admin/schools/toggle/{{ school.id }}" class="d-inline">
                            <button type="submit"
                                class="btn btn-sm {{ 'btn-outline-success' if school.is_active == 0 else 'btn-outline-warning' }}">
                                {{ '売 蜀埼幕縺吶ｋ' if school.is_active == 0 else '竢ｸ・・蛛懈ｭ｢縺吶ｋ' }}
                            </button>
                        </form>
                        <button type="submit" class="btn btn-sm btn-outline-danger">蜑企勁</button>
                        </form>
                    </div>
                </div>

                {% if school.classes %}
                <hr>
                <h6 class="text-muted">繧ｯ繝ｩ繧ｹ荳隕ｧ</h6>
                <div class="row row-cols-1 row-cols-md-3 g-2">
                    {% for cls in school.classes %}
                    <div class="col">
                        <div class="border rounded p-2">
                            <strong>{{ cls.name }}</strong>
                            <div class="text-muted small">繧ｯ繝ｩ繧ｹ繧ｳ繝ｼ繝・ <code>{{ cls.code }}</code></div>
                            <div class="text-muted small">繝｡繝ｳ繝舌・: {{ cls.members|length }}莠ｺ</div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
        {% else %}
        <p class="text-muted">縺ｾ縺蟄ｦ譬｡繧ｰ繝ｫ繝ｼ繝励′縺ゅｊ縺ｾ縺帙ｓ縲・/p>
        {% endfor %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function copyCode(code) {
            navigator.clipboard.writeText(code);
            alert('繧ｳ繝ｼ繝峨・ + code + '縲阪ｒ繧ｳ繝斐・縺励∪縺励◆・・);
        }
    </script>
</body>

</html>
