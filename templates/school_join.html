<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蟄ｦ譬｡繧ｰ繝ｫ繝ｼ繝励↓蜿ょ刈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f0fff4 0%, #f0f9ff 100%); color: #333; }
        .brand-color { color: #28a745; }
        .footer { color: #666; padding: 1rem 0; }
    </style>
</head>
<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・/small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・/a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0" style="border-radius:1rem;">
                    <h3 class="text-center mb-4 brand-color">蟄ｦ譬｡繧ｰ繝ｫ繝ｼ繝励↓蜿ょ刈</h3>
                    <p class="text-muted text-center small">邂｡逅・・°繧牙女縺大叙縺｣縺溷ｭｦ譬｡繧ｳ繝ｼ繝峨ｒ蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・/p>

                    {% if message %}
                    <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">蟄ｦ譬｡繧ｳ繝ｼ繝・/label>
                            <input type="text" name="code" class="form-control" placeholder="萓具ｼ哂BC12345" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">蜿ょ刈縺吶ｋ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
