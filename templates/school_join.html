<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学校グループに参加</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f0fff4 0%, #f0f9ff 100%); color: #333; }
        .brand-color { color: #28a745; }
        .footer { color: #666; padding: 1rem 0; }
    </style>
</head>
<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 brand-color">図鑑</span>
                <small class="text-muted ms-2">オンライン図鑑</small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/user">戻る</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0" style="border-radius:1rem;">
                    <h3 class="text-center mb-4 brand-color">学校グループに参加</h3>
                    <p class="text-muted text-center small">管理者から受け取った学校コードを入力してください。</p>

                    {% if message %}
                    <div class="alert alert-danger">{{ message }}</div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">学校コード</label>
                            <input type="text" name="code" class="form-control" placeholder="例：ABC12345" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">参加する</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>© {{ now().year }} 図鑑 — {{ verj }}</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div id="maintenance_overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,247,240,0.97); z-index:99999; align-items:center; justify-content:center; flex-direction:column;">
    <div style="text-align:center; background:white; border-radius:2rem; padding:3rem; box-shadow:0 10px 40px rgba(0,0,0,0.1); max-width:400px;">
        <div style="font-size:4rem; animation:spin 2s linear infinite; display:inline-block;">🔧</div>
        <h2 style="color:#ff6b6b; margin-top:1rem;">メンテナンス中</h2>
        <p style="color:#666;">ただいまシステムのメンテナンスを行っています。</p>
        <div style="background:#fff3cd; border-radius:0.5rem; padding:0.5rem 1rem; font-size:0.85rem;">
            <span id="maintenance_check_count">復旧確認中...</span>
        </div>
    </div>
</div>
<style>@keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }</style>
<script>
(function() {
    const IS_MAINTENANCE_PAGE = window.location.pathname.startsWith('/maintenance');
    if (IS_MAINTENANCE_PAGE) return;
    const overlay = document.getElementById('maintenance_overlay');
    let isMaintenance = false;
    let checkCount = 0;
    async function checkMaintenance() {
        try {
            const res = await fetch('/api/health', { cache: 'no-store' });
            if (!res.ok) {
                if (!isMaintenance) { isMaintenance = true; overlay.style.display = 'flex'; }
                checkCount++;
                document.getElementById('maintenance_check_count').textContent = `復旧確認中... (${checkCount}回目)`;
            } else {
                if (isMaintenance) { isMaintenance = false; overlay.style.display = 'none'; checkCount = 0; }
            }
        } catch(e) {}
    }
    setInterval(checkMaintenance, 300);
})();
</script>
</body>
</html>
