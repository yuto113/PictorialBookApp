<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アクセスログ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%); color: #333; }
        .brand-color { color: #ff6b6b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand brand-color fw-bold" href="/">📖 図鑑</a>
            <a class="btn btn-sm btn-outline-secondary" href="/admin">管理に戻る</a>
        </div>
    </nav>
    <div class="container py-4">
        <h2 class="brand-color mb-4">📋 アクセスログ（最新500件）</h2>
        <div class="table-responsive">
            <table class="table table-striped table-sm table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>日時</th>
                        <th>ユーザーID</th>
                        <th>ページ</th>
                        <th>IPアドレス</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td><small>{{ (log.accessed_at.replace(tzinfo=none) + timedelta(hours=21)).strftime('%Y/%m/%d %H:%M:%S') }}</small></td>
                        <td>{{ log.user_id or '未ログイン' }}</td>
                        <td>{{ log.path }}</td>
                        <td><small class="text-muted">{{ log.ip_address }}</small></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
