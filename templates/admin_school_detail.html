<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ school.name }} 邂｡逅・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%); color: #333; }
        .brand-color { color: #ff6b6b; }
        .footer { color: #666; padding: 1rem 0; }
    </style>
</head>
<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">蟄ｦ譬｡邂｡逅・/small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/admin/schools">謌ｻ繧・/a>
        </div>
    </nav>

    <div class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <h2 class="mb-2 brand-color">{{ school.name }}</h2>
        <p class="text-muted">蟄ｦ譬｡繧ｳ繝ｼ繝・ <code>{{ school.code }}</code></p>

        <div class="row g-4">

            <!-- 繝ｦ繝ｼ繧ｶ繝ｼ逋ｻ骭ｲ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">側 繝ｦ繝ｼ繧ｶ繝ｼ逋ｻ骭ｲ</h5>
                    <form method="POST" action="/admin/create_school_user">
                        <input type="hidden" name="school_id" value="{{ school.id }}">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">蜷榊燕</label>
                            <input type="text" name="name" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">蛻晄悄繝代せ繝ｯ繝ｼ繝・/label>
                            <input type="text" name="password" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">蠖ｹ蜑ｲ</label>
                            <select name="role" class="form-select form-select-sm">
                                <option value="student">蟄ｦ逕・/option>
                                <option value="teacher">謨吝ｸｫ</option>
                                <option value="school_admin">蟄ｦ譬｡邂｡逅・・/option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-sm btn-danger w-100">逋ｻ骭ｲ</button>
                    </form>
                </div>
            </div>

            <!-- 繧ｯ繝ｩ繧ｹ荳隕ｧ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">答 繧ｯ繝ｩ繧ｹ荳隕ｧ</h5>
                    {% for cls in classes %}
                    <div class="border rounded p-2 mb-2">
                        <strong>{{ cls.name }}</strong>
                        <span class="text-muted small ms-2">繧ｳ繝ｼ繝・ <code>{{ cls.code }}</code></span>
                        <span class="badge bg-info text-dark ms-1">{{ cls.members|length }}莠ｺ</span>
                    </div>
                    {% else %}
                    <p class="text-muted small">繧ｯ繝ｩ繧ｹ縺後≠繧翫∪縺帙ｓ縲・/p>
                    {% endfor %}
                </div>
            </div>

            <!-- 謨吝ｸｫ荳隕ｧ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">捉窶昨沛ｫ 謨吝ｸｫ荳隕ｧ</h5>
                    {% for teacher in teachers %}
                    <div class="border rounded p-2 mb-2">
                        <strong>{{ teacher.name }}</strong>
                        <span class="badge bg-primary ms-2">{{ teacher.role }}</span>
                        <small class="text-muted ms-2">ID: {{ teacher.id }}</small>
                    </div>
                    {% else %}
                    <p class="text-muted small">謨吝ｸｫ縺後＞縺ｾ縺帙ｓ縲・/p>
                    {% endfor %}
                </div>
            </div>

            <!-- 逕溷ｾ剃ｸ隕ｧ -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">捉窶昨沁・逕溷ｾ剃ｸ隕ｧ</h5>
                    <div style="max-height:200px; overflow-y:auto;">
                        {% for student in students %}
                        <div class="border rounded p-2 mb-2">
                            <strong>{{ student.name }}</strong>
                            <small class="text-muted ms-2">ID: {{ student.id }}</small>
                        </div>
                        {% else %}
                        <p class="text-muted small">逕溷ｾ偵′縺・∪縺帙ｓ縲・/p>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <!-- 謚慕ｨｿ荳隕ｧ -->
            <div class="col-12">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">胴 謚慕ｨｿ荳隕ｧ</h5>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>蜷榊燕</th>
                                    <th>謚慕ｨｿ閠・/th>
                                    <th>迥ｶ諷・/th>
                                    <th>謫堺ｽ・/th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for date in dates %}
                                <tr>
                                    <td>{{ date.id }}</td>
                                    <td>
                                        <a href="/date/{{ date.id }}" class="text-decoration-none fw-bold">{{ date.name }}</a>
                                    </td>
                                    <td>{{ date.user.name }}</td>
                                    <td>
                                        {% if date.is_hidden == 1 %}
                                        <span class="badge bg-warning text-dark">髱櫁｡ｨ遉ｺ</span>
                                        {% else %}
                                        <span class="badge bg-success">陦ｨ遉ｺ荳ｭ</span>
                                        {% endif %}
                                    </td>
                                    <td>
                                        <a href="/date/{{ date.id }}" class="btn btn-sm btn-outline-primary">隧ｳ邏ｰ</a>
                                        <form method="POST" action="/admin/toggle_school_date/{{ date.id }}" class="d-inline">
                                            <input type="hidden" name="school_id" value="{{ school.id }}">
                                            <button type="submit" class="btn btn-sm btn-outline-warning">
                                                {{ '陦ｨ遉ｺ' if date.is_hidden == 1 else '髱櫁｡ｨ遉ｺ' }}
                                            </button>
                                        </form>
                                        <form method="POST" action="/admin/delete_school_date/{{ date.id }}" class="d-inline" onsubmit="return confirm('譛ｬ蠖薙↓蜑企勁縺励∪縺吶°・・)">
                                            <input type="hidden" name="school_id" value="{{ school.id }}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">蜑企勁</button>
                                        </form>
                                    </td>
                                </tr>
                                {% else %}
                                <tr>
                                    <td colspan="5" class="text-muted">謚慕ｨｿ縺後≠繧翫∪縺帙ｓ縲・/td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer class="footer text-center mt-4">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
