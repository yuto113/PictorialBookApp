<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>繝ｬ繝薙Η繝ｼ邂｡逅・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%);
            color: #333;
        }

        .brand-color {
            color: #ff6b6b;
        }

        .footer {
            color: #666;
            padding: 1rem 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/user">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">繝ｬ繝薙Η繝ｼ邂｡逅・/small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・/a>
        </div>
    </nav>

    <div class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <h2 class="mb-4 brand-color">闘 繝ｬ繝薙Η繝ｼ邂｡逅・/h2>

        <h4 class="mb-3">竢ｳ 謇ｿ隱榊ｾ・■・・{ pending|length }}莉ｶ・・/h4>
        {% for review in pending %}
        <div class="card shadow-sm border-0 p-3 mb-2" style="border-radius:1rem;">
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                    <strong>{{ review.user.name }}縺輔ｓ</strong>
                    {% if review.role_label %}<small class="text-muted">・・{ review.role_label }}・・/small>{% endif %}
                    <div class="text-warning my-1">{{ '笘・ * review.stars }}{{ '笘・ * (5 - review.stars) }}</div>
                    <p class="mb-1">{{ review.message }}</p>
                    <small class="text-muted">{{ review.created_at.strftime('%Y/%m/%d %H:%M') }}</small>
                </div>
                <div class="d-flex gap-2 ms-2">
                    <form method="POST" action="/admin/reviews/approve/{{ review.id }}" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-success">謇ｿ隱・/button>
                    </form>
                    <form method="POST" action="/admin/reviews/delete/{{ review.id }}" class="d-inline"
                        onsubmit="return confirm('蜑企勁縺励∪縺吶°・・)">
                        <button type="submit" class="btn btn-sm btn-outline-danger">蜑企勁</button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <p class="text-muted">謇ｿ隱榊ｾ・■縺ｯ縺ゅｊ縺ｾ縺帙ｓ縲・/p>
        {% endfor %}

        <h4 class="mb-3 mt-5">笨・謇ｿ隱肴ｸ医∩・・{ approved|length }}莉ｶ・・/h4>
        {% for review in approved %}
        <div class="card shadow-sm border-0 p-3 mb-2" style="border-radius:1rem;">
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                    <strong>{{ review.user.name }}縺輔ｓ</strong>
                    {% if review.role_label %}<small class="text-muted">・・{ review.role_label }}・・/small>{% endif %}
                    <div class="text-warning my-1">{{ '笘・ * review.stars }}{{ '笘・ * (5 - review.stars) }}</div>
                    <p class="mb-1">{{ review.message }}</p>
                    <small class="text-muted">{{ review.created_at.strftime('%Y/%m/%d %H:%M') }}</small>
                </div>
                <div class="ms-2">
                    <form method="POST" action="/admin/reviews/delete/{{ review.id }}" class="d-inline"
                        onsubmit="return confirm('蜑企勁縺励∪縺吶°・・)">
                        <button type="submit" class="btn btn-sm btn-outline-danger">蜑企勁</button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <p class="text-muted">謇ｿ隱肴ｸ医∩縺ｯ縺ｾ縺縺ゅｊ縺ｾ縺帙ｓ縲・/p>
        {% endfor %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>

<script>
    // メンテナンスモード監視（0.3秒ごと）
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) {
                    window.location.href = '/maintenance/current';
                }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
</script>

</body>

</html>
