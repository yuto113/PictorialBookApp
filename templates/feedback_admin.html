<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>繝輔ぅ繝ｼ繝峨ヰ繝・け邂｡逅・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%); color: #333; }
        .brand-color { color: #ff6b6b; }
        .footer { color: #666; padding: 1rem 0; }
    </style>
</head>
<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/user">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・/small>
            </a>
            <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・/a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-2 brand-color">繝輔ぅ繝ｼ繝峨ヰ繝・け邂｡逅・/h2>
        <p class="text-muted">譛ｪ隱ｭ: <strong>{{ unread_count }}</strong>莉ｶ</p>

        {% for fb in feedbacks %}
        <div class="card mb-3 shadow-sm border-0 {% if fb.is_read == 0 %}border-start border-danger border-3{% endif %}" style="border-radius:1rem;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ fb.user.name }}</strong>
                        <small class="text-muted ms-2">{{ fb.created_at }}</small>
                    </div>
                    {% if fb.is_read == 0 %}
                    <span class="badge bg-danger">譛ｪ隱ｭ</span>
                    {% else %}
                    <span class="badge bg-success">譌｢隱ｭ</span>
                    {% endif %}
                </div>
                <p class="mt-2 mb-2">{{ fb.message }}</p>

                {% if fb.reply %}
                <div class="alert alert-info mb-2">
                    <strong>霑比ｿ｡貂医∩・・/strong> {{ fb.reply }}
                    <small class="text-muted d-block">{{ fb.replied_at }}</small>
                </div>
                {% endif %}

                <form method="POST" class="d-flex gap-2 mt-2">
                    <input type="hidden" name="feedback_id" value="{{ fb.id }}">
                    <input type="text" class="form-control form-control-sm" name="reply" placeholder="霑比ｿ｡繧貞・蜉・.." required>
                    <button type="submit" class="btn btn-sm btn-primary">霑比ｿ｡</button>
                </form>
            </div>
        </div>
        {% else %}
        <p class="text-muted">繝輔ぅ繝ｼ繝峨ヰ繝・け縺後≠繧翫∪縺帙ｓ縲・/p>
        {% endfor %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // メンテナンスモード監視（0.3秒ごと）
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) {
                    window.location.href = '/maintenance/current';
                }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
</script>

</body>
</html>
