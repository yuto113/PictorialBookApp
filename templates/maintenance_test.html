<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>システムテスト中 - 図鑑</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%); color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .test-card { background: white; border-radius: 2rem; padding: 3rem; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); max-width: 600px; width: 100%; }
        .test-icon { font-size: 4rem; margin-bottom: 1rem; display: inline-block; }
        .spinning { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .brand-color { color: #ff6b6b; }
        .test-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 0.5rem; background: #f8f9fa; text-align: left; }
        .test-item.ok { background: #d4edda; }
        .test-item.error { background: #f8d7da; }
        .test-item.pending { background: #fff3cd; }
        .progress { height: 8px; border-radius: 4px; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b; animation: blink 0.3s ease-in-out infinite; margin-right: 4px; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="test-card">
        <div class="test-icon spinning" id="icon">🔍</div>
        <h2 class="brand-color fw-bold mb-2" id="title">システムテスト中...</h2>
        <p class="text-muted mb-3" id="subtitle">全機能を確認しています。しばらくお待ちください。</p>
        <div class="progress mb-4">
            <div class="progress-bar bg-danger" id="progress_bar" role="progressbar" style="width: 0%"></div>
        </div>
        <div id="test_results" class="mb-3">
            <div class="test-item pending"><span>⏳ テスト開始待ち...</span></div>
        </div>
        <div id="result_message" class="d-none"></div>
        <div class="mt-3">
            <small class="text-muted"><span class="status-dot"></span><span id="check_status">テスト実行中...</span></small>
        </div>
    </div>
    <script>
        const returnUrl = document.referrer || '/user';
        let checkInterval = null;

        async function runTests() {
            document.getElementById('check_status').textContent = 'テストAPIに接続中...';
            const res = await fetch('/api/maintenance/run_tests');
            const data = await res.json();
            const resultsDiv = document.getElementById('test_results');
            resultsDiv.innerHTML = '';
            let i = 0;
            for (const result of data.results) {
                await new Promise(resolve => setTimeout(resolve, 150));
                const item = document.createElement('div');
                item.className = `test-item ${result.status}`;
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center w-100"
                        ${result.files && result.files.length > 0 ? 'style="cursor:pointer;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'"' : ''}>
                        <span>${result.status === 'ok' ? '✅' : '❌'} <strong>${result.name}</strong></span>
                        <small class="text-muted">${result.detail}${result.files && result.files.length > 0 ? ' ▼' : ''}</small>
                    </div>
                    ${result.files && result.files.length > 0
                        ? `<div style="display:none; width:100%; margin-top:0.5rem; font-size:0.8rem; color:#666; text-align:left;">
                                ${result.files.map(f => '・' + f).join('<br>')}
                            </div>`
                        : ''}`;
                item.style.flexWrap = 'wrap';
                resultsDiv.appendChild(item);
                i++;
                document.getElementById('progress_bar').style.width = Math.round((i / data.results.length) * 100) + '%';
                document.getElementById('check_status').textContent = `テスト中 ${i}/${data.results.length}...`;
            }

            const msgDiv = document.getElementById('result_message');
            msgDiv.classList.remove('d-none');

            if (data.all_ok) {
                document.getElementById('icon').textContent = '🎉';
                document.getElementById('icon').classList.remove('spinning');
                document.getElementById('title').textContent = '全テスト合格！';
                document.getElementById('subtitle').textContent = 'システムは正常です。元のページに戻ります...';
                document.getElementById('progress_bar').classList.remove('bg-danger');
                document.getElementById('progress_bar').classList.add('bg-success');
                document.getElementById('check_status').textContent = '✅ 全テスト合格！メンテナンス解除完了';
                msgDiv.innerHTML = '<div class="alert alert-success">✅ メンテナンスモードを解除しました！元のページへ戻ります。</div>';
                // 0.3秒ごとに復旧確認して自動リダイレクト
                checkInterval = setInterval(async () => {
                    try {
                        const r = await fetch('/api/health', { cache: 'no-store' });
                        if (r.ok) { clearInterval(checkInterval); window.location.href = returnUrl; }
                    } catch(e) {}
                }, 300);
            } else {
                document.getElementById('icon').textContent = '⚠️';
                document.getElementById('icon').classList.remove('spinning');
                document.getElementById('title').textContent = '問題が見つかりました';
                document.getElementById('subtitle').textContent = 'いくつかのテストに失敗しました。メンテナンスモードを継続します。';
                document.getElementById('check_status').textContent = '❌ テスト失敗 - メンテナンスモード継続中';
                msgDiv.innerHTML = `<div class="alert alert-danger">❌ テストに失敗しました。メンテナンスモードを継続します。</div><form method="POST" action="/admin/maintenance/off" class="mt-2"><button type="submit" class="btn btn-warning">強制的に解除する</button></form>`;
            }
        }

        window.addEventListener('load', () => { setTimeout(runTests, 300); });
    </script>
</body>
</html>
