<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>繝励Ο繝輔ぅ繝ｼ繝ｫ邱ｨ髮・/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: {
                    {
                    'linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%)' if is_school_user else 'linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%)'
                }
            }

            ;
            color: #333;
        }

        .brand-color {
            color: {
                    {
                    '#28a745' if is_school_user else '#ff6b6b'
                }
            }

            ;
        }

        .card-edit {
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="{{ 'theme-green' if is_school_user else 'theme-pink' }}">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <a href="/profile/{{ user.id }}" class="btn btn-sm btn-outline-secondary mb-3">竊・謌ｻ繧・/a>

                <div class="card card-edit p-4 bg-white">
                    <h3 class="text-center mb-4 brand-color">繝励Ο繝輔ぅ繝ｼ繝ｫ邱ｨ髮・/h3>

                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-4 text-center">
                            <label class="form-label d-block">迴ｾ蝨ｨ縺ｮ繧｢繧､繧ｳ繝ｳ</label>
                            {% if user.icon_image and user.icon_image.startswith('http') %}
                            <img src="{{ user.icon_image }}" width="120" height="120"
                                class="rounded-circle border mb-3 shadow-sm" style="object-fit: cover;">
                            {% else %}
                            <img src="{{ url_for('static', filename='icons/default.png') }}" width="120" height="120"
                                class="rounded-circle border mb-3 shadow-sm" style="object-fit: cover;">
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">縺ｪ縺ｾ縺・/label>
                            <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="icon_file" class="form-label fw-bold">譁ｰ縺励＞繧｢繧､繧ｳ繝ｳ逕ｻ蜒上ｒ繧｢繝・・繝ｭ繝ｼ繝・/label>
                            <input type="file" id="icon_file" name="icon_file" class="form-control" accept="image/*">
                            <div class="form-text">豁｣譁ｹ蠖｢縺ｫ霑代＞逕ｻ蜒上′縺翫☆縺吶ａ縺ｧ縺呻ｼ・/div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 shadow-sm fw-bold">螟画峩繧剃ｿ晏ｭ倥☆繧具ｼ・/button>
                    </form>
                </div>
            </div>
        </div>
    </div>

<script>
    // メンテナンスモード監視（0.3秒ごと）
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) {
                    window.location.href = '/maintenance/current';
                }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
</script>

</body>

</html>
