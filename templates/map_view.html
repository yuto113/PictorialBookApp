    <script>
        const map = L.map('map').setView([36.0, 138.0], 6);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>�n���@�^�C��</a>"
        }).addTo(map);

        const mapData = {{ map_data| safe }};

        mapData.forEach(d => {
            const marker = L.marker([d.lat, d.lng]).addTo(map);
            marker.bindPopup(`
                ${d.image ? `<img src="${d.image}" alt="${d.name}">` : ''}
                <strong>${d.name}</strong><br>
                <small>? ${d.place}</small><br>
                <small>? ${d.user}</small>
                <a href="/date/${d.id}" class="btn btn-sm btn-outline-primary mt-1">�ڍׂ�����</a>
            `);
        });

        // �}�[�J�[��0���̂Ƃ�
        if (mapData.length === 0) {
            const info = L.control();
            info.onAdd = function () {
                const div = L.DomUtil.create('div', 'leaflet-bar');
                div.innerHTML = '<div style="background:white;padding:8px;border-radius:4px;">�ʒu���̂��铊�e������܂���</div>';
                return div;
            };
            info.addTo(map);
        }

        // �S�}�[�J�[��������悤�ɃY�[��

            map.fitBounds(bounds, { padding: [30, 30] });
        }
    </script>

<script>
    // メンテナンスモード監視（0.3秒ごと）
    (function() {
        const IS_MAINTENANCE_PAGE = window.location.pathname.includes('/maintenance');
        if (IS_MAINTENANCE_PAGE) return;
        
        async function checkMaintenance() {
            try {
                const res = await fetch('/api/health', { cache: 'no-store' });
                if (!res.ok) {
                    window.location.href = '/maintenance/current';
                }
            } catch(e) {}
        }
        setInterval(checkMaintenance, 300);
    })();
</script>
