<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・- upload</title>
    <meta property="og:title" content="図鑑 - みんなで作るオンライン図鑑">
    <meta property="og:description" content="見つけた植物・動物の写真と情報をみんなで共有！あなただけの図鑑を作ろう！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://2026-yuto-book.up.railway.app/">
    <meta property="og:image" content="https://2026-yuto-book.up.railway.app/static/ogp.png">
    <meta property="og:site_name" content="図鑑">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            background: {{ 'linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%)' if is_school_user else 'linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%)' }};
            color: #333;
        }
        .brand-color { color: {{ '#28a745' if is_school_user else '#ff6b6b' }}; }
        .card-upload { border-radius: 1rem; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.06); }
        .footer { color: #666; padding: 1rem 0; }
        .form-control:focus { box-shadow: 0 0 0 0.2rem rgba(255, 107, 107, 0.12); }
        #map { width: 100%; height: 300px; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/user">
                <span class="fs-4 brand-color">蝗ｳ髑・/span>
                <small class="text-muted ms-2">繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・/small>
            </a>
            <div>
                <a class="btn btn-sm btn-outline-secondary" href="/user">謌ｻ繧・/a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-upload p-4 bg-white">
                    <h3 class="mb-3">譁ｰ縺励＞蝗ｳ髑代ｒ謚慕ｨｿ縺吶ｋ</h3>
                    <p class="text-muted small">蜀咏悄縺ｨ諠・ｱ繧偵い繝・・繝ｭ繝ｼ繝峨＠縺ｦ縲√∩繧薙↑縺ｮ繧ｳ繝ｬ繧ｯ繧ｷ繝ｧ繝ｳ縺ｫ霑ｽ蜉縺励∪縺励ｇ縺・・/p>

                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="name" class="form-label">蜷榊燕・域､咲黄繝ｻ蜍慕黄・・/label>
                            <input type="text" id="name" name="name" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="place" class="form-label">隕九▽縺代◆蝣ｴ謇</label>
                            <input type="text" id="place" name="place" class="form-control" required />
                        </div>

                        {% if is_school_user %}
                        <div class="mb-3">
                            <label for="knowledge" class="form-label">遏･縺｣縺ｦ縺・ｋ縺薙→</label>
                            <textarea id="knowledge" name="knowledge" class="form-control" rows="3"
                                placeholder="縺薙・逕溘″迚ｩ縺ｫ縺､縺・※遏･縺｣縺ｦ縺・ｋ縺薙→繧呈嶌縺・※縺ｿ繧医≧・・></textarea>
                        </div>

                        {% if school_use_map %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">桃 蝣ｴ謇繧貞慍蝗ｳ縺ｧ驕ｸ縺ｶ</label>
                            <div id="map"></div>
                        </div>
                        {% endif %}

                        {% if user_role in ['teacher', 'school_admin'] %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">豆 騾∽ｿ｡蜈・/label>
                            <div class="border rounded p-3 bg-light">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" name="send_school"
                                        id="send_school" checked>
                                    <label class="form-check-label" for="send_school">
                                        将 蟄ｦ譬｡蜈ｨ菴・
                                    </label>
                                </div>
                                {% if my_classes %}
                                <hr class="my-2">
                                <p class="small text-muted mb-2">繧ｯ繝ｩ繧ｹ繧帝∈謚橸ｼ・/p>
                                {% for cls in my_classes %}
                                <div class="form-check mb-1">
                                    <input class="form-check-input" type="checkbox" name="send_class_{{ cls.id }}"
                                        id="send_class_{{ cls.id }}">
                                    <label class="form-check-label" for="send_class_{{ cls.id }}">
                                        答 {{ cls.name }}
                                    </label>
                                </div>
                                {% endfor %}
                                {% endif %}
                            </div>
                        </div>
                        {% endif %}

                        {% if available_assignments %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">統 隱ｲ鬘後↓謠仙・</label>
                            <select name="assignment_id" class="form-select">
                                <option value="">隱ｲ鬘後ｒ驕ｸ謚槭＠縺ｪ縺・/option>
                                {% for assignment in available_assignments %}
                                <option value="{{ assignment.id }}">{{ assignment.title }}・・{ assignment.school_class.name }}・臥ｷ蛻・ {{ assignment.deadline.strftime('%m/%d %H:%M') }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}

                        {% else %}
                        <!-- 騾壼ｸｸ繝ｦ繝ｼ繧ｶ繝ｼ逕ｨ縺ｮ蝨ｰ蝗ｳ -->
                        <div id="map"></div>
                        {% endif %}

                        {%- if session.get('user_id') == 2 %}
                        <div class="mb-3">
                            <label for="subject" class="form-label">遞ｮ鬘橸ｼ亥・蠑冗畑・・/label>
                            <input type="text" id="subject" name="subject" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label for="explanatorytext" class="form-label">隱ｬ譏取枚・亥・蠑冗畑・・/label>
                            <textarea id="explanatorytext" name="explanatorytext" class="form-control"
                                rows="3"></textarea>
                        </div>
                        {%- endif %}

                        <div class="mb-3">
                            <label for="file" class="form-label">逕ｻ蜒・/label>
                            <input type="file" id="file" name="file" class="form-control" required />
                        </div>

                        <input type="hidden" id="lat" name="lat" />
                        <input type="hidden" id="lng" name="lng" />

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="copyright_check" required>
                            <label class="form-check-label" for="copyright_check">
                                謚慕ｨｿ縺吶ｋ逕ｻ蜒上・諠・ｱ縺ｯ閾ｪ蛻・〒謦ｮ蠖ｱ繝ｻ菴懈・縺励◆繧ゅ・縺ｧ縺ゅｊ縲・
                                莉冶・・闡嶺ｽ懈ｨｩ繧剃ｾｵ螳ｳ縺励※縺・↑縺・％縺ｨ繧堤｢ｺ隱阪＠縺ｾ縺励◆縲・
                            </label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <button class="btn btn-danger">騾∽ｿ｡</button>
                            <div class="text-end">
                                {% if upload %}
                                <div class="text-success">{{ upload }} 繧偵い繝・・繝ｭ繝ｼ繝峨〒縺阪∪縺励◆縲・/div>
                                {% endif %}
                                <a href="/user" class="btn btn-link">繝帙・繝逕ｻ髱｢縺ｸ</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <small>ﾂｩ {{ now().year }} 蝗ｳ髑・窶・{{ verj }}</small>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        window.addEventListener('load', () => {
            const mapEl = document.getElementById('map');
            if (!mapEl) return;

            const map = L.map('map').setView([35.125695, 136.918672], 15);

            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>蝨ｰ逅・劼繧ｿ繧､繝ｫ</a>"
            }).addTo(map);

            map.invalidateSize();

            const marker = L.marker(map.getCenter()).addTo(map);

            map.on('click', function (e) {
                const latlng = e.latlng;
                document.getElementById('lat').value = latlng.lat;
                document.getElementById('lng').value = latlng.lng;
                marker.setLatLng(latlng);
                marker.setPopupContent("蠎ｧ讓・ " + latlng.toString()).openPopup();
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
