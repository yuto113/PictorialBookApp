<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>蝗ｳ髑・ 縺ｿ繧薙↑縺ｧ菴懊ｋ繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑・title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js" defer></script>
    <style>
        body {
            background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%);
            color: #333;
            overflow-x: hidden;
        }

        .brand-color {
            color: #ff6b6b;
        }

        .hero {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
            color: white;
            padding: 6rem 0 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 1s ease;
        }

        .hero p {
            font-size: 1.3rem;
            animation: fadeInUp 1s 0.2s ease backwards;
        }

        .hero .cta-buttons {
            animation: fadeInUp 1s 0.4s ease backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .hero-emoji {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            font-size: 5rem;
            margin: 1rem;
        }

        .btn-hero {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .btn-hero:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-hero-primary {
            background: white;
            color: #ff6b6b;
        }

        .btn-hero-primary:hover {
            background: #fff;
            color: #ff4757;
            animation: pulse 1s infinite;
        }

        .stats-section {
            background: white;
            padding: 3rem 0;
            margin: -2rem 0 0;
            border-radius: 2rem 2rem 0 0;
            position: relative;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
        }

        .stat-card {
            text-align: center;
            padding: 1rem;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #666;
            font-weight: bold;
            font-size: 1rem;
        }

        .feature-section {
            padding: 4rem 0;
        }

        .feature-card {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            height: 100%;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            border-color: #ff9a9e;
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.15);
        }

        .feature-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .feature-card:hover .feature-icon {
            animation: pulse 1s ease infinite;
        }

        .reviews-section {
            background: linear-gradient(135deg, #fafafa 0%, #fff 100%);
            padding: 4rem 0;
        }

        .review-card {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            height: 100%;
            position: relative;
            transition: transform 0.3s;
        }

        .review-card:hover {
            transform: translateY(-5px);
        }

        .review-stars {
            color: #ffc107;
            font-size: 1.2rem;
        }

        .review-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .collection-section {
            padding: 4rem 0;
            background: linear-gradient(135deg, #fff7f0 0%, #f0f9ff 100%);
        }

        .card-tilt {
            transform: rotate(-0.5deg);
            transition: transform 0.3s;
        }

        .card-tilt:hover {
            transform: rotate(0deg) scale(1.03);
        }

        .cta-section {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff9a9e 100%);
            color: white;
            padding: 5rem 0;
            text-align: center;
        }

        .cta-section h2 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .footer {
            color: #666;
            padding: 2rem 0;
            background: white;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .hero-emoji {
                font-size: 3rem;
            }

            .stat-number {
                font-size: 2rem;
            }

            .cta-section h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    </div>

    <div class="feature-section">

            <p class="text-center text-muted mb-5">縺九ｓ縺溘ｓ3繧ｹ繝・ヨ・ｽ・ｽ繝励〒縺ゅ↑縺滂ｿｽE繝・ヨ・ｽE繧ｿ繧偵∩繧薙↑縺ｫ蜈ｱ譛会ｼ・p>
            <div class="row g-4">

                    </div>

                <div class="col-md-4">
                    <div class="feature-card">
                        <div class="feature-icon">亮・ｽE・ｽE/div>
                        <h5 class="fw-bold">蝨ｰ蝗ｳ縺ｧ險倬鹸</h5>

                    </div>
                </div>
                <div class="col-md-4">

                    </div>
                </div>
            </div>
        </div>
    </div>

    {% if reviews %}

            <p class="text-center text-muted mb-5">蛻ｩ逕ｨ閠・ｿｽE譁ｹ縲・ｿｽ・ｽ繧牙ｬ峨＠縺・ｿｽ・ｽ螢ｰ繧偵＞縺溘□縺・ｿｽ・ｽ縺・ｿｽ・ｽ縺呻ｼ・p>

                <div class="col-md-4">
                    <div class="review-card">
                        <div class="d-flex align-items-center mb-3">
                            <div class="review-avatar">{{ review.user.name[0] }}</div>
                            <div class="ms-3">

                                {% endif %}
                            </div>
                        </div>
                        <div class="review-stars mb-2">{{ '笘・ * review.stars }}{{ '笘・ * (5 - review.stars) }}</div>

                </div>
                {% endfor %}

    {% endif %}

    {% if dates %}

            <h2 class="text-center brand-color fw-bold mb-2">減 縺ｿ繧薙↑縺ｮ繧ｳ繝ｬ繧ｯ繧ｷ繝ｧ繝ｳ</h2>
            <p class="text-center text-muted mb-5">縺薙ｓ縺ｪ邏謨ｵ縺ｪ謚慕ｨｿ縺後◆縺上＆繧・逋ｻ骭ｲ縺励※縺ゅ↑縺溘ｂ謚慕ｨｿ縺励ｈ縺・/p>

                        {% if date.imagepass %}
                        <a href="{{ date.imagepass }}" data-lightbox="group" class="d-block overflow-hidden"
                            style="border-top-left-radius:1rem; border-top-right-radius:1rem;">
                            <img src="{{ date.imagepass }}" class="card-img-top" alt="{{ date.name }}"

                        </a>
                        {% endif %}
                        <div class="card-body">
                            <h5 class="card-title mb-1">{{ date.name }}</h5>
                            {% if date.subject %}
                            <p class="card-text text-muted small mb-1">遞ｮ鬘・ {{ date.subject }}</p>
                            {% endif %}

                                    {% else %}

                                    {% endif %}

    <div class="cta-section">

            <div class="d-flex gap-3 justify-content-center flex-wrap">

    <footer class="footer text-center">

                <a href="/privacy" class="text-decoration-none text-muted">柏 繝励Λ繧､繝舌す繝ｼ繝昴Μ繧ｷ繝ｼ</a>
            </div>
            <small>ﾂｩ {{ now.year }} 蝗ｳ髑鯛・繧ｪ繝ｳ繝ｩ繧､繝ｳ蝗ｳ髑代ｒ縺ｿ繧薙↑縺ｧ菴懊ｍ縺・small>
        </div>
    </footer>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
